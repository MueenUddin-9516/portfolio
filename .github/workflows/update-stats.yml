name: Weekly research figures

on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday, 06:17 Qatar time
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/update_stats.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "stats-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -am "Refresh research figures"
            git push
          fi
